<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dental Clinic App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="#">Dental Clinic</a><span id="userInfo" class="text-white"></span></div></nav>
<main class="container py-4">
<section class="hero rounded-4 p-4 mb-4 text-white shadow-sm"><h1 class="display-6 fw-bold">Система за управление на часове</h1><p class="mb-0">Пациенти, стоматолози, графици и записани часове в дентална клиника.</p></section>
<div class="row g-4">
<div class="col-lg-4">
 <div class="card shadow-sm"><div class="card-body"><h4>Вход</h4><input id="email" class="form-control mb-2" value="admin@clinic.com"><input id="password" class="form-control mb-2" value="Admin123!" type="password"><button class="btn btn-primary w-100" onclick="login()">Вход</button><button class="btn btn-outline-secondary w-100 mt-2" onclick="logout()">Изход</button><div id="authMsg" class="small mt-2"></div></div></div>
 <div class="card shadow-sm mt-4"><div class="card-body"><h4>Нов пациент</h4><input id="pName" class="form-control mb-2" placeholder="Име"><input id="pEmail" class="form-control mb-2" placeholder="Email"><input id="pPhone" class="form-control mb-2" placeholder="Телефон"><input id="pAddress" class="form-control mb-2" placeholder="Адрес"><button class="btn btn-success w-100" onclick="createPatient()">Запази пациент</button></div></div>
 <div class="card shadow-sm mt-4"><div class="card-body"><h4>Нов стоматолог</h4><input id="dName" class="form-control mb-2" placeholder="Име"><input id="dSpecialty" class="form-control mb-2" placeholder="Специалност"><input id="dPhone" class="form-control mb-2" placeholder="Телефон"><input id="dEmail" class="form-control mb-2" placeholder="Email"><input id="dPrice" class="form-control mb-2" placeholder="Цена" type="number" value="70"><button class="btn btn-success w-100" onclick="createDentist()">Запази стоматолог</button></div></div>
</div>
<div class="col-lg-8">
<ul class="nav nav-pills mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#patients">Пациенти</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#dentists">Стоматолози</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#schedules">Графици</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#appointments">Часове</button></li></ul>
<div class="tab-content">
 <div id="patients" class="tab-pane fade show active"><div class="card shadow-sm"><div class="card-body"><div class="row g-2 mb-3"><div class="col"><input id="patientSearch" class="form-control" placeholder="Търсене по име, email или телефон"></div><div class="col-auto"><button class="btn btn-primary" onclick="loadPatients()">Търси</button></div></div><div id="patientsList"></div></div></div></div>
 <div id="dentists" class="tab-pane fade"><div class="card shadow-sm"><div class="card-body"><div class="row g-2 mb-3"><div class="col"><input id="dentistNameSearch" class="form-control" placeholder="Име"></div><div class="col"><input id="dentistSpecialtySearch" class="form-control" placeholder="Специалност"></div><div class="col-auto"><button class="btn btn-primary" onclick="loadDentists()">Търси</button></div></div><div id="dentistsList"></div></div></div></div>
 <div id="schedules" class="tab-pane fade"><div class="card shadow-sm"><div class="card-body"><h5>Нов график</h5><div class="row g-2 mb-2"><div class="col"><input id="sDentist" class="form-control" value="1" placeholder="Dentist ID"></div><div class="col"><input id="sDate" class="form-control" type="date"></div><div class="col"><input id="sStart" class="form-control" type="time" value="09:00"></div><div class="col"><input id="sEnd" class="form-control" type="time" value="17:00"></div></div><input id="sNotes" class="form-control mb-2" placeholder="Бележки"><button class="btn btn-success mb-3" onclick="createSchedule()">Запази график</button> <button class="btn btn-primary mb-3" onclick="loadSchedules()">Зареди графици</button><div id="schedulesList"></div></div></div></div>
 <div id="appointments" class="tab-pane fade"><div class="card shadow-sm"><div class="card-body"><h5>Нов час</h5><div class="row g-2"><div class="col"><input id="aPatient" class="form-control" placeholder="Patient ID" value="1"></div><div class="col"><input id="aDentist" class="form-control" placeholder="Dentist ID" value="1"></div><div class="col"><input id="aDate" class="form-control" type="date"></div><div class="col"><input id="aTime" class="form-control" type="time" value="10:00"></div></div><input id="aReason" class="form-control my-2" placeholder="Причина"><button class="btn btn-success mb-3" onclick="createAppointment()">Запиши час</button> <button class="btn btn-primary mb-3" onclick="loadAppointments()">Зареди часове</button><div id="appointmentsList"></div></div></div></div>
</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script>
</body></html>
